name: Rust query partition experiment

on:
  pull_request:
    paths:
      - '.github/workflows/codeql-rust-experiment.yml'
      - '.github/codeql/**'
      - 'scripts/codeql_query_experiment.py'
      - 'scripts/tests/test_codeql_query_experiment.py'

permissions:
  contents: read
  security-events: write

jobs:
  partition:
    name: Rust query experiment (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify query partition helper
        run: python3 -m unittest scripts/tests/test_codeql_query_experiment.py
      - name: Prepare query partition
        run: python3 scripts/codeql_query_experiment.py prepare "${{ matrix.group }}" .github/codeql/rust-experiment.yml
      - name: Initialize Rust analysis
        id: init
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: rust
          build-mode: none
          config-file: .github/codeql/rust-experiment.yml
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Restore extractor Cargo cache
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/codeql-experiment-cargo
          key: rust-query-experiment-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.init.outputs.codeql-version }}-${{ github.sha }}-${{ matrix.group }}
      - name: Analyze query partition
        id: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        env:
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ runner.temp }}/codeql-experiment-cargo
        with:
          category: /rust-query-experiment/${{ matrix.group }}
          output: ${{ runner.temp }}/query-results
      - name: Verify partition coverage
        run: python3 scripts/codeql_query_experiment.py verify "${{ matrix.group }}" "$RUNNER_TEMP/query-results"
      - name: Save extractor Cargo cache
        if: ${{ success() && steps.analyze.outcome == 'success' && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/codeql-experiment-cargo
          key: ${{ steps.restore.outputs.cache-primary-key }}
