name: Cargo package verification and publishing

on:
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'crates/**'
      - 'vendor/svg2pdf/**'
      - 'saved/blank2010.hwp'
      - 'mydocs/manual/**'
      - 'mydocs/tech/agent_roadmap/atlas_r1_r200.md'
      - 'llms.txt'
      - 'LICENSE'
      - 'THIRD_PARTY_LICENSES.md'
      - 'scripts/cargo_release.py'
      - 'scripts/tests/test_cargo*'
      - '.github/workflows/cargo-publish.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish from an approved cargo-v<version> tag
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: cargo-packages-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate a requested release before building
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "cargo-v${version}"
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libfreetype6-dev
      - name: Check archive contents
        run: python3 scripts/tests/test_cargo_package_contents.py -v
      - name: Check release safeguards
        run: python3 -m unittest discover -s scripts/tests -p test_cargo_release.py -v
      - name: Verify archives and standalone consumers without uploading
        run: python3 scripts/cargo_release.py

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libfreetype6-dev
      - name: Verify the release tag belongs to main
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "cargo-v${version}"
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Publish verified packages in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package="$(python3 -c 'import tomllib; p=tomllib.load(open("Cargo.toml", "rb"))["package"]; print(p["name"] + "@" + p["version"])')"
          python3 scripts/cargo_release.py publish --confirm "$package" --commit "$GITHUB_SHA"
