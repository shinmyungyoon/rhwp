[package]
include = ["/Cargo.toml", "/src/**", "/LICENSE-MIT", "/LICENSE-APACHE", "/NOTICE", "/README.md", "/RHWP_PATCHES.md"]
name = "shin-rhwp-svg2pdf"
publish = ["crates-io"]
description = "Convert SVG files to PDFs."
categories = ["encoding", "graphics", "multimedia"]
keywords = ["svg", "pdf", "vector-graphics", "conversion"]
version = "0.13.0"
authors = ["Laurenz Stampfl <laurenz.stampfl@gmail.com>", "Martin Haug <mhaug@live.de>"]
edition = "2021"
repository = "https://github.com/shinmyungyoon/rhwp"
readme = "README.md"
license = "MIT OR Apache-2.0"

[lib]
name = "svg2pdf"
bench = false

[features]
default = ["image", "filters", "text"]
image = ["dep:image"]
filters = ["image", "dep:tiny-skia", "resvg/raster-images"]
text = [
    "usvg/text", "resvg/text", "dep:siphasher",
    "dep:subsetter", "dep:ttf-parser", "dep:fontdb",
]

[dependencies]
miniz_oxide = "0.8"
once_cell = "1.18"
pdf-writer = "0.12"
fontdb = { version = "0.23", optional = true }
usvg = { version = "0.45", default-features = false }
log = "0.4"
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "gif"], optional = true }
tiny-skia = { version = "0.11.4", optional = true }
resvg = { version = "0.45", default-features = false, optional = true }
subsetter = { version = "0.2", optional = true }
ttf-parser = { version = "0.25", optional = true }
siphasher = { version = "1.0.1", optional = true }
